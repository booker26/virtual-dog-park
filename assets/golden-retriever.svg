<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Illustration of a Golden Retriever">
  <!-- Background -->
  <rect width="240" height="220" fill="#fff7e6"/>

  <!-- Floppy golden ears -->
  <ellipse cx="66" cy="118" rx="24" ry="50" fill="#d99a3e"/>
  <ellipse cx="174" cy="118" rx="24" ry="50" fill="#d99a3e"/>

  <!-- Head (golden) -->
  <circle cx="120" cy="108" r="64" fill="#eab85a"/>

  <!-- Muzzle (lighter golden) -->
  <ellipse cx="120" cy="138" rx="38" ry="30" fill="#f3d391"/>

  <!-- Eyes -->
  <circle cx="100" cy="102" r="7" fill="#3a2b1a"/>
  <circle cx="140" cy="102" r="7" fill="#3a2b1a"/>
  <circle cx="102" cy="100" r="2" fill="#fff"/>
  <circle cx="142" cy="100" r="2" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="120" cy="132" rx="11" ry="8" fill="#2b2b2b"/>

  <!-- Happy smile + tongue -->
  <path d="M120 140 v6 M120 146 q-14 10 -26 2 M120 146 q14 10 26 2" stroke="#5b4636" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M112 150 q8 16 16 0 q-8 6 -16 0 Z" fill="#e8748a"/>

  <!-- Body -->
  <path d="M68 202 q-8 -52 52 -52 q60 0 52 52 Z" fill="#eab85a"/>
  <path d="M102 176 q18 -24 36 0 q-4 30 -18 30 q-14 0 -18 -30 Z" fill="#f3d391"/>

  <!-- Tail -->
  <path d="M190 198 q36 -6 36 -38 q-6 22 -36 22 Z" fill="#eab85a"/>
</svg>
