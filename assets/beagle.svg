<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Illustration of a Beagle">
  <!-- Background -->
  <rect width="240" height="220" fill="#fef6ec"/>

  <!-- Floppy brown ears -->
  <ellipse cx="62" cy="120" rx="26" ry="48" fill="#7a4a2b"/>
  <ellipse cx="178" cy="120" rx="26" ry="48" fill="#7a4a2b"/>

  <!-- Head (tan) -->
  <circle cx="120" cy="110" r="62" fill="#e8c39e"/>

  <!-- White muzzle -->
  <ellipse cx="120" cy="140" rx="40" ry="32" fill="#fdfbf7"/>

  <!-- Brown eye patch -->
  <path d="M88 92 q14 -18 34 -10 q-6 22 -22 26 q-18 2 -12 -16 Z" fill="#7a4a2b"/>
  <path d="M152 92 q-14 -18 -34 -10 q6 22 22 26 q18 2 12 -16 Z" fill="#7a4a2b"/>

  <!-- Eyes -->
  <circle cx="100" cy="104" r="7" fill="#2b2b2b"/>
  <circle cx="140" cy="104" r="7" fill="#2b2b2b"/>

  <!-- Nose -->
  <ellipse cx="120" cy="134" rx="11" ry="8" fill="#2b2b2b"/>

  <!-- Mouth -->
  <path d="M120 142 v8 M120 150 q-12 8 -22 2 M120 150 q12 8 22 2" stroke="#5b4636" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Body with white chest -->
  <path d="M70 200 q-6 -50 50 -50 q56 0 50 50 Z" fill="#e8c39e"/>
  <path d="M104 175 q16 -22 32 0 q-4 28 -16 28 q-12 0 -16 -28 Z" fill="#fdfbf7"/>

  <!-- Tail with white tip -->
  <path d="M188 196 q34 -10 30 -40 q-2 22 -30 24 Z" fill="#e8c39e"/>
  <path d="M214 156 q4 -8 -2 -16 q-8 10 2 16 Z" fill="#fdfbf7"/>
</svg>
